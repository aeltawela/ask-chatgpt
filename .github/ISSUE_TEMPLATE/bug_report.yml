name: Bug report
description: Report a reproducible problem without sharing private data.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Never include tokens, email addresses, private prompts, transcripts or local paths.
  - type: input
    id: harness
    attributes:
      label: Harness and version
      placeholder: Qwen Code 0.x
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Explain the smallest redacted steps that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: validation
    attributes:
      label: Validation performed
      placeholder: npm test, live client check, or unverified
    validations:
      required: true
